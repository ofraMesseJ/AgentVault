# docker-compose.yml - Production deployment
version: '3.8'

services:
  openagent:
    build: .
    ports:
      - "18789:18789"
    volumes:
      - ./workspace:/app/workspace
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock  # For sandboxing
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - DEFAULT_MODEL=Qwen/Qwen2.5-7B-Instruct
      - SANDBOX_MODE=docker
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
  # Optional: Use Ollama for local model serving
  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  ollama: